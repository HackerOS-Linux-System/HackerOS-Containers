[package]
name = "hco"
version = "0.3.0"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "MIT"
description = "Advanced container runtime with user namespaces, seccomp, CNI, REST API, and Docker/Podman compatibility."

[[bin]]
name = "hco"
path = "src/main.rs"

[dependencies]
# CLI & UI
lexopt     = "0.3.0"
owo-colors = "3.5.0"
miette     = { version = "5.10.0", features = ["fancy"] }
thiserror  = "1.0"
termion    = "2.0"

# Structured logging / tracing
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry         = { version = "0.21", features = ["trace"] }
opentelemetry_sdk     = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.14", features = ["tonic", "grpc-tonic"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# System & Low Level
# nix 0.27 does NOT have a "pty" feature — PTY lives under "term"
nix = { version = "0.27.1", features = [
    "process", "sched", "fs", "signal", "mount",
    "user", "net", "ioctl", "hostname", "resource",
    "mman", "term", "poll",
] }
libc       = "0.2"
caps       = "0.5"
libseccomp = "0.3"

# Networking
ureq     = { version = "2.9", features = ["json", "tls"] }
flate2   = "1.0"
tar      = "0.4"
sha2     = "0.10"
hex      = "0.4"
walkdir  = "2.4"
base64   = "0.21"

# Web / API
axum           = { version = "0.7", features = ["macros"] }
tower          = { version = "0.4", features = ["full"] }
tower-http     = { version = "0.5", features = ["trace", "limit", "timeout"] }
tokio          = { version = "1.0", features = ["full"] }
# TLS: need hyper + hyper-util for manual TLS accept loop
hyper          = { version = "1", features = ["http1", "server"] }
hyper-util     = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls   = "0.24"
rustls         = "0.21"
rustls-pemfile = "1.0"

# Metrics
prometheus = "0.13"

# Validation
regex = "1.10"

# SQLite state store
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# Utility
uuid        = { version = "1.0", features = ["v4"] }
once_cell   = "1.18"
chrono      = { version = "0.4", features = ["serde"] }
rand        = "0.8"
lazy_static = "1.4"
parking_lot = "0.12"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
