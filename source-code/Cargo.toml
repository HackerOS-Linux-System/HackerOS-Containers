[package]
name = "hco"
version = "0.2.0"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "MIT"
description = "Advanced container runtime with user namespaces, seccomp, CNI, REST API, and Docker/Podman compatibility."

[[bin]]
name = "hco"
path = "src/main.rs"

[dependencies]
# CLI & UI
lexopt = "0.3.0"
owo-colors = "3.5.0"
miette = { version = "5.10.0", features = ["fancy"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
termion = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# System & Low Level
nix = { version = "0.27.1", features = ["process", "sched", "fs", "signal", "mount", "user", "net", "ioctl", "hostname", "resource", "mman", "term", "poll"] }
libc = "0.2"
caps = "0.5"
libseccomp = "0.3"   # dla seccomp

# Networking
ureq = { version = "2.9", features = ["json"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"
base64 = "0.21"

# Web / API
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
prometheus = "0.13"

# Utility
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.18"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rand = "0.8"
lazy_static = "1.4"
